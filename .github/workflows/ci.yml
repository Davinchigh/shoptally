name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint and tests on MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: shoptally_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: mysql+pymysql://ci:ci-password@127.0.0.1:3306/shoptally_test
      JWT_SECRET: ci-only-secret-0123456789-abcdefghij
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest httpx ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Docker images build
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shoptally-api ./backend
      - run: docker build -t shoptally-web ./frontend
      - name: Smoke test the whole stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 3
          done
          curl -fsS http://localhost:8080/api/health
          docker compose down -v
